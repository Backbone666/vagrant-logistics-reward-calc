<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vagrant Logistics - Courier Calculator</title>
    <link
      rel="icon"
      type="image/png"
      href="https://images.evetech.net/corporations/98403600/logo"
    />
    <link rel="stylesheet" href="style.css" />
    <meta
      name="description"
      content="Premium Vagrant Logistics Courier Calculator for EVE Online. Get precise quotes for your hauling needs with a gold-standard interface."
    />
    <!-- Meta tags for SEO -->
    <meta
      property="og:title"
      content="Vagrant Logistics - Courier Calculator"
    />
    <meta
      property="og:description"
      content="Calculate your shipping rewards with precision and style."
    />
    <meta
      property="og:image"
      content="https://images.evetech.net/corporations/98403600/logo"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <img
          src="https://images.evetech.net/corporations/98403600/logo"
          alt="Vagrant Logistics Logo"
          class="logo"
        />
        <h1>Vagrant Logistics</h1>
        <h2>Courier Calculator</h2>
      </header>

      <main class="calculator-card">
        <div class="grid">
          <section class="input-area" role="group" aria-labelledby="input-area-title">
            <h3 id="input-area-title" class="sr-only">Contract Details</h3>
            <div class="input-group">
              <label for="collateral">Collateral (ISK)</label>
              <input
                id="collateral"
                type="text"
                placeholder="0"
                class="to_format_number to_change"
                autocomplete="off"
                aria-describedby="collateral-hint"
              />
              <div id="collateral-hint" class="input-hint">
                <a
                  href="https://janice.e-351.com/"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Use SELL value as collateral.</a
                >
              </div>
            </div>

            <div class="input-group">
              <label for="jumps">Number of Jumps</label>
              <input
                id="jumps"
                type="text"
                placeholder="0"
                class="to_format_number to_change"
                autocomplete="off"
              />
            </div>

            <div class="input-group">
              <label for="volume">Volume (m³)</label>
              <input
                id="volume"
                type="text"
                placeholder="0"
                class="to_format_number to_change"
                autocomplete="off"
              />
              <div class="presets" role="group" aria-label="Volume Presets">
                <button type="button" class="preset-btn" data-val="1,125,000" aria-label="Set volume to Freighter (1,125,000 m³)">
                  Freighter
                </button>
                <button type="button" class="preset-btn" data-val="62,500" aria-label="Set volume to Deep Space Transport (62,500 m³)">
                  DST
                </button>
                <button type="button" class="preset-btn" data-val="12,500" aria-label="Set volume to Blockade Runner (12,500 m³)">
                  Blockade Runner
                </button>
              </div>
            </div>

            <div class="checkbox-group">
              <label class="checkbox-item">
                <input type="checkbox" id="type_ipj" class="to_change" />
                <span class="checkbox-custom"></span>
                Low / Nullsec / Dangerous Space
              </label>
            </div>
          </section>

          <section class="result-area" aria-live="polite">
            <div class="reward-display">
              <div class="reward-label" id="reward-label">Estimated Reward</div>
              <div id="reward_output" class="reward-value" aria-labelledby="reward-label">0 ISK</div>
              <div id="reward_ipj_output" class="reward-ipj" aria-label="Reward per Jump">0 ISK/Jump</div>
              <div class="button-group">
                <button type="button" id="copy_btn" class="btn-copy">
                  Copy Reward
                </button>
                <button type="button" id="clear_btn" class="btn-clear">
                  Clear
                </button>
              </div>
            </div>
          </section>
        </div>

        <div class="contract-requirements">
          <div class="req-card">
            <div class="req-label">Contract To</div>
            <div class="req-value-box">
              <span class="req-value">Vagrant Logistics</span>
              <button
                type="button"
                class="btn-mini-copy"
                data-copy="Vagrant Logistics"
                aria-label="Copy Vagrant Logistics name"
              >
                Copy
              </button>
            </div>
          </div>
          <div class="req-card">
            <div class="req-label">Time to Accept</div>
            <div class="req-value">3 Days</div>
          </div>
          <div class="req-card">
            <div class="req-label">Time to Complete</div>
            <div class="req-value">3 Days</div>
          </div>
        </div>
      </main>

      <footer class="footer">
        <img
          src="https://images.evetech.net/alliances/99011546/logo"
          alt="The Charter Logo"
          class="footer-logo"
        />
        <span>Member of The Charter</span>
      </footer>
    </div>

    <script>
      const collateralInput = document.getElementById("collateral");
      const jumpsInput = document.getElementById("jumps");
      const volumeInput = document.getElementById("volume");
      const typeIpjCheckbox = document.getElementById("type_ipj");
      const rewardOutput = document.getElementById("reward_output");
      const rewardIpjOutput = document.getElementById("reward_ipj_output");
      const copyBtn = document.getElementById("copy_btn");
      const clearBtn = document.getElementById("clear_btn");

      let currentReward = 0;

      const formatNumber = (val, allowDecimal = true) => {
        const regex = allowDecimal ? /[^0-9.]/g : /[^0-9]/g;
        let cleaned = val.toString().replace(regex, "");

        if (allowDecimal) {
          const parts = cleaned.split(".");
          if (parts.length > 2) {
            cleaned = `${parts[0]}.${parts.slice(1).join("")}`;
          }
        }

        if (!cleaned) return "";

        if (allowDecimal && cleaned.includes(".")) {
          const [integerPart, decimalPart] = cleaned.split(".");
          if (integerPart === "") return `.${decimalPart}`;
          const formattedInteger = new Intl.NumberFormat("en-US").format(
            integerPart,
          );
          return `${formattedInteger}.${decimalPart}`;
        } else {
          return new Intl.NumberFormat("en-US").format(cleaned);
        }
      };

      const parseNum = (val) => parseFloat(val.replace(/,/g, "")) || 0;

      function calcReward() {
        const volume = parseNum(volumeInput.value);
        const jumps = parseNum(jumpsInput.value);
        const collateral = parseNum(collateralInput.value);
        const isDangerousSpace = typeIpjCheckbox.checked;

        // 1. Global Collateral Cap
        if (collateral > 5_000_000_000) return "Risako Hirano";

        // 2. Basic Validation
        if (volume <= 0 || jumps <= 0 || collateral < 0) return 0;

        let baseFee = 0;
        let ratePerJump = 0;

        // 3. Service Tier Logic
        if (isDangerousSpace) {
          // --- DANGEROUS SPACE (Lowsec / Nullsec) ---
          if (volume <= 12_500) {
            // BLOCKADE RUNNER (BR)
            // Low/Null: 10M Base + 2M/Jump
            baseFee = 10_000_000;
            ratePerJump = 2_000_000;
          } else if (volume <= 62_500) {
            // DEEP SPACE TRANSPORT (DST)
            // Low/Null: 20M Base + 5M/Jump
            baseFee = 20_000_000;
            ratePerJump = 5_000_000;
          } else if (volume <= 360_000) {
            // JUMP FREIGHTER (JF)
            // Low/Null: 150M Base + 35M/Jump (CORRECTED)
            baseFee = 150_000_000;
            ratePerJump = 35_000_000;
          } else {
            return "Max Volume 360,000 m³ (JF)";
          }
        } else {
          // --- HIGH SECURITY (Highsec) ---
          if (volume <= 12_500) {
            // BLOCKADE RUNNER (BR)
            // Highsec: 3M Base + 800k/Jump
            baseFee = 3_000_000;
            ratePerJump = 800_000;
          } else if (volume <= 62_500) {
            // DEEP SPACE TRANSPORT (DST)
            // Highsec: 8M Base + 1.2M/Jump
            baseFee = 8_000_000;
            ratePerJump = 1_200_000;
          } else if (volume <= 1_125_000) {
            // FREIGHTER
            // Highsec: 15M Base + 1.8M/Jump
            baseFee = 15_000_000;
            ratePerJump = 1_800_000;
          } else {
            return "Max Volume 1,125,000 m³ (Freighter)";
          }
        }

        // 4. Calculate Transport Cost
        let totalReward = baseFee + jumps * ratePerJump;

        // 5. Collateral Fee Schedule (Global)
        // 0 - 1B: FREE
        // 1B - 3B: 0.3% of Total Value
        // 3B - 5B: 0.5% of Total Value
        if (collateral > 1_000_000_000 && collateral <= 3_000_000_000) {
          totalReward += collateral * 0.003;
        } else if (collateral > 3_000_000_000) {
          totalReward += collateral * 0.005;
        }

        // 6. Minimum Reward Floor
        // Ensure profitability on very short jumps
        if (totalReward < baseFee) {
          totalReward = baseFee;
        }

        return totalReward;
      }

      function updateAll() {
        const reward = calcReward();
        currentReward = reward;
        const rawJumps = parseNum(jumpsInput.value) || 1;

        // Trigger animation via class toggle without forcing reflow
        rewardOutput.classList.remove("updated");
        requestAnimationFrame(() => {
          rewardOutput.classList.add("updated");
        });

        // Reset classes
        rewardOutput.classList.remove("small");

        if (typeof reward === "string") {
          rewardOutput.textContent = reward;
          if (reward !== "Risako Hirano") {
            rewardOutput.classList.add("small");
          }
          rewardIpjOutput.textContent =
            reward === "Risako Hirano" ? "Contact in game" : "N/A";
        } else if (reward > 0) {
          const finalVal = Math.max(1_000_000, Math.ceil(reward));
          rewardOutput.textContent = `${formatNumber(finalVal)} ISK`;

          const ipj = finalVal / rawJumps;
          rewardIpjOutput.textContent =
            `${formatNumber(Math.ceil(ipj))} ISK/Jump`;
        } else {
          rewardOutput.textContent = "0 ISK";
          rewardIpjOutput.textContent = "0 ISK/Jump";
        }
      }

      // Mini copy buttons
      document.querySelectorAll(".btn-mini-copy").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const val = btn.getAttribute("data-copy");
          try {
            await navigator.clipboard.writeText(val);
            const originalText = btn.textContent;
            btn.textContent = "Copied!";
            btn.classList.add("copied");
            setTimeout(() => {
              btn.textContent = originalText;
              btn.classList.remove("copied");
            }, 1500);
          } catch (err) {
            console.error("Failed to copy: ", err);
          }
        });
      });

      // Live formatting as user types
      document.querySelectorAll(".to_format_number").forEach((input) => {
        input.addEventListener("input", (e) => {
          const start = e.target.selectionStart;
          const end = e.target.selectionEnd;
          const oldLen = e.target.value.length;

          const isDecimalAllowed =
            e.target.id === "collateral" || e.target.id === "volume";
          e.target.value = formatNumber(e.target.value, isDecimalAllowed);

          const newLen = e.target.value.length;
          const delta = newLen - oldLen;

          e.target.setSelectionRange(start + delta, end + delta);
          updateAll();
        });
      });

      document.querySelectorAll(".to_change").forEach((el) => {
        el.addEventListener("change", updateAll);
      });

      document.querySelectorAll(".preset-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          volumeInput.value = formatNumber(btn.getAttribute("data-val"));
          updateAll();
        });
      });

      copyBtn.addEventListener("click", async () => {
        let textToCopy = "";
        const originalText = copyBtn.textContent;

        if (currentReward === "Risako Hirano") {
          textToCopy = "Risako Hirano";
        } else if (typeof currentReward === "number" && currentReward > 0) {
          textToCopy = Math.max(1_000_000, Math.ceil(currentReward)).toString();
        }

        if (textToCopy) {
          try {
            await navigator.clipboard.writeText(textToCopy);
            copyBtn.textContent =
              textToCopy === "Risako Hirano"
                ? "Name Copied!"
                : "Reward Copied!";
            copyBtn.classList.add("copied");
            setTimeout(() => {
              copyBtn.textContent = originalText;
              copyBtn.classList.remove("copied");
            }, 2000);
          } catch (err) {
            console.error("Failed to copy: ", err);
          }
        }
      });

      clearBtn.addEventListener("click", () => {
        collateralInput.value = "";
        jumpsInput.value = "";
        volumeInput.value = "";
        typeIpjCheckbox.checked = false;
        updateAll();
      });

      // Initial Call
      updateAll();
    </script>
  </body>
</html>
