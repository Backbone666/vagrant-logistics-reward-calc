<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vagrant Logistics - Courier Calculator</title>
    <link
      rel="icon"
      type="image/png"
      href="https://images.evetech.net/corporations/98403600/logo"
    />
    <link rel="stylesheet" href="style.css" />
    <meta
      name="description"
      content="Premium Vagrant Logistics Courier Calculator for EVE Online. Get precise quotes for your hauling needs with a gold-standard interface."
    />
    <!-- Meta tags for SEO -->
    <meta
      property="og:title"
      content="Vagrant Logistics - Courier Calculator"
    />
    <meta
      property="og:description"
      content="Calculate your shipping rewards with precision and style."
    />
    <meta
      property="og:image"
      content="https://images.evetech.net/corporations/98403600/logo"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <img
          src="https://images.evetech.net/corporations/98403600/logo"
          alt="Vagrant Logistics Logo"
          class="logo"
        />
        <h1>Vagrant Logistics</h1>
        <h2>Courier Calculator</h2>
      </header>

      <main class="calculator-card">
        <div class="grid">
          <section class="input-area">
            <div class="input-group">
              <label for="collateral">Collateral (ISK)</label>
              <input
                id="collateral"
                type="text"
                placeholder="0"
                class="to_format_number to_change"
                autocomplete="off"
              />
            </div>

            <div class="input-group">
              <label for="jumps">Number of Jumps</label>
              <input
                id="jumps"
                type="text"
                placeholder="0"
                class="to_format_number to_change"
                autocomplete="off"
              />
            </div>

            <div class="input-group">
              <label for="volume">Volume (m³)</label>
              <input
                id="volume"
                type="text"
                placeholder="0"
                class="to_format_number to_change"
                autocomplete="off"
              />
              <div class="presets">
                <button type="button" class="preset-btn" data-val="1,125,000">
                  Freighter
                </button>
                <button type="button" class="preset-btn" data-val="62,500">
                  DST
                </button>
                <button type="button" class="preset-btn" data-val="12,000">
                  Blockade Runner
                </button>
              </div>
            </div>

            <div class="checkbox-group">
              <label class="checkbox-item">
                <input type="checkbox" id="type_ipj" class="to_change" />
                <span class="checkbox-custom"></span>
                Low / Nullsec / Dangerous Space
              </label>
            </div>
          </section>

          <section class="result-area">
            <div class="reward-display">
              <div class="reward-label">Estimated Reward</div>
              <div id="reward_output" class="reward-value">0 ISK</div>
              <div id="reward_ipj_output" class="reward-ipj">0 ISK/Jump</div>
              <div class="button-group">
                <button type="button" id="copy_btn" class="btn-copy">
                  Copy Reward
                </button>
                <button type="button" id="clear_btn" class="btn-clear">
                  Clear
                </button>
              </div>
            </div>
          </section>
        </div>

        <div class="contract-requirements">
          <div class="req-card">
            <div class="req-label">Contract To</div>
            <div class="req-value-box">
              <span class="req-value">Vagrant Logistics</span>
              <button
                type="button"
                class="btn-mini-copy"
                data-copy="Vagrant Logistics"
              >
                Copy
              </button>
            </div>
          </div>
          <div class="req-card">
            <div class="req-label">Time to Accept</div>
            <div class="req-value">3 Days</div>
          </div>
          <div class="req-card">
            <div class="req-label">Time to Complete</div>
            <div class="req-value">3 Days</div>
          </div>
        </div>
      </main>

      <footer class="footer">
        <img
          src="https://images.evetech.net/alliances/99011546/logo"
          alt="The Charter Logo"
          class="footer-logo"
        />
        <span>Member of The Charter</span>
      </footer>
    </div>

    <script>
      const collateralInput = document.getElementById("collateral");
      const jumpsInput = document.getElementById("jumps");
      const volumeInput = document.getElementById("volume");
      const typeIpjCheckbox = document.getElementById("type_ipj");
      const rewardOutput = document.getElementById("reward_output");
      const rewardIpjOutput = document.getElementById("reward_ipj_output");
      const copyBtn = document.getElementById("copy_btn");
      const clearBtn = document.getElementById("clear_btn");

      let currentReward = 0;

      const formatNumber = (val) => {
        let num = val.toString().replace(/[^0-9]/g, "");
        if (!num) return "";
        return new Intl.NumberFormat("en-US").format(num);
      };

      const parseNum = (val) => parseFloat(val.replace(/,/g, "")) || 0;

      function calcReward() {
        const volume = parseNum(volumeInput.value);
        const jumps = parseNum(jumpsInput.value);
        const collateral = parseNum(collateralInput.value);
        const isDangerousSpace = typeIpjCheckbox.checked;

        if (collateral > 5_000_000_000) return "Risako Hirano";
        if (volume <= 0 || jumps <= 0 || collateral <= 0) return 0;

        let baseFee = 0;
        let ratePerJump = 0;
        let collateralLimit = 0;

        if (isDangerousSpace) {
          if (volume <= 10_000) {
            // Covert Ops
            baseFee = 15_000_000;
            ratePerJump = 5_000_000;
            collateralLimit = 2_000_000_000;
          } else if (volume <= 360_000) {
            // Jump Freighter
            baseFee = 150_000_000;
            ratePerJump = 50_000_000;
            collateralLimit = 10_000_000_000;
          } else {
            return "Shipment too large for dangerous routes";
          }
        } else {
          // High Security
          if (volume <= 12_500) {
            // Blockade Runner
            baseFee = 1_000_000;
            ratePerJump = 750_000;
            collateralLimit = 3_000_000_000;
          } else if (volume <= 62_500) {
            // Deep Space Transport
            baseFee = 3_000_000;
            ratePerJump = 1_500_000;
            collateralLimit = 5_000_000_000;
          } else if (volume <= 900_000) {
            // Freighter
            baseFee = 10_000_000;
            ratePerJump = 3_500_000;
            collateralLimit = 3_000_000_000;
          } else {
            return "Shipment exceeds HighSec volume limits";
          }
        }

        // Check collateral limits per tier
        if (collateral > collateralLimit) {
          return "Collateral exceeds tier limit";
        }

        let totalReward = baseFee + jumps * ratePerJump;

        // Collateral Surcharge (1.5% for > 1B)
        if (collateral > 1_000_000_000) {
          totalReward += collateral * 0.015;
        }

        // Minimum Reward Enforce (HS only per rates.md)
        if (!isDangerousSpace) {
          totalReward = Math.max(3_000_000, totalReward);
        }

        return totalReward;
      }

      function updateAll() {
        const reward = calcReward();
        currentReward = reward;
        const rawJumps = parseNum(jumpsInput.value) || 1;

        // Trigger animation
        rewardOutput.classList.remove("updated");
        void rewardOutput.offsetWidth; // Force reflow
        rewardOutput.classList.add("updated");

        if (typeof reward === "string") {
          rewardOutput.textContent = reward;
          rewardOutput.style.fontSize =
            reward === "Risako Hirano" ? "2.2rem" : "1.2rem";
          rewardIpjOutput.textContent =
            reward === "Risako Hirano" ? "Contact in game" : "N/A";
        } else if (reward > 0) {
          const finalVal = Math.max(1_000_000, Math.ceil(reward));
          rewardOutput.textContent = formatNumber(finalVal) + " ISK";
          rewardOutput.style.fontSize = "2.2rem";

          const ipj = finalVal / rawJumps;
          rewardIpjOutput.textContent =
            formatNumber(Math.ceil(ipj)) + " ISK/Jump";
        } else {
          rewardOutput.textContent = "0 ISK";
          rewardOutput.style.fontSize = "2.2rem";
          rewardIpjOutput.textContent = "0 ISK/Jump";
        }
      }

      // Mini copy buttons
      document.querySelectorAll(".btn-mini-copy").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const val = btn.getAttribute("data-copy");
          try {
            await navigator.clipboard.writeText(val);
            const originalText = btn.textContent;
            btn.textContent = "Copied!";
            btn.classList.add("copied");
            setTimeout(() => {
              btn.textContent = originalText;
              btn.classList.remove("copied");
            }, 1500);
          } catch (err) {
            console.error("Failed to copy: ", err);
          }
        });
      });

      // Live formatting as user types
      document.querySelectorAll(".to_format_number").forEach((input) => {
        input.addEventListener("input", (e) => {
          const start = e.target.selectionStart;
          const end = e.target.selectionEnd;
          const oldLen = e.target.value.length;

          e.target.value = formatNumber(e.target.value);

          const newLen = e.target.value.length;
          const delta = newLen - oldLen;

          e.target.setSelectionRange(start + delta, end + delta);
          updateAll();
        });
      });

      document.querySelectorAll(".to_change").forEach((el) => {
        el.addEventListener("change", updateAll);
      });

      document.querySelectorAll(".preset-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          volumeInput.value = formatNumber(btn.getAttribute("data-val"));
          updateAll();
        });
      });

      copyBtn.addEventListener("click", async () => {
        let textToCopy = "";
        let originalText = copyBtn.textContent;

        if (currentReward === "Risako Hirano") {
          textToCopy = "Risako Hirano";
        } else if (typeof currentReward === "number" && currentReward > 0) {
          textToCopy = Math.max(1_000_000, Math.ceil(currentReward)).toString();
        }

        if (textToCopy) {
          try {
            await navigator.clipboard.writeText(textToCopy);
            copyBtn.textContent =
              textToCopy === "Risako Hirano"
                ? "Name Copied!"
                : "Reward Copied!";
            copyBtn.classList.add("copied");
            setTimeout(() => {
              copyBtn.textContent = originalText;
              copyBtn.classList.remove("copied");
            }, 2000);
          } catch (err) {
            console.error("Failed to copy: ", err);
          }
        }
      });

      clearBtn.addEventListener("click", () => {
        collateralInput.value = "";
        jumpsInput.value = "";
        volumeInput.value = "";
        typeIpjCheckbox.checked = false;
        updateAll();
      });

      // Initial Call
      updateAll();
    </script>
  </body>
</html>
