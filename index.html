<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vagrant Logistics - High Fidelity Courier Calculator</title>
    <link
      rel="icon"
      type="image/png"
      href="https://images.evetech.net/corporations/98403600/logo"
    />
    <link rel="stylesheet" href="style.css" />
    <meta
      name="description"
      content="Premium Vagrant Logistics Courier Calculator for EVE Online. Get precise quotes for your hauling needs with a gold-standard interface."
    />
    <!-- Meta tags for SEO -->
    <meta
      property="og:title"
      content="Vagrant Logistics - Courier Calculator"
    />
    <meta
      property="og:description"
      content="Calculate your shipping rewards with precision and style."
    />
    <meta
      property="og:image"
      content="https://images.evetech.net/corporations/98403600/logo"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <img
          src="https://images.evetech.net/corporations/98403600/logo"
          alt="Vagrant Logistics Logo"
          class="logo"
        />
        <h1>Vagrant Logistics</h1>
        <h2>High Fidelity Courier Calculator</h2>
      </header>

      <main class="calculator-card">
        <div class="grid">
          <section class="input-area">
            <div class="input-group">
              <label for="collateral">Collateral (ISK)</label>
              <input
                id="collateral"
                type="text"
                placeholder="0"
                class="to_format_number to_change"
                autocomplete="off"
              />
            </div>

            <div class="input-group">
              <label for="jumps">Number of Jumps</label>
              <input
                id="jumps"
                type="text"
                placeholder="0"
                class="to_format_number to_change"
                autocomplete="off"
              />
            </div>

            <div class="input-group">
              <label for="volume">Volume (m³)</label>
              <input
                id="volume"
                type="text"
                placeholder="0"
                class="to_format_number to_change"
                autocomplete="off"
              />
              <div class="presets">
                <button type="button" class="preset-btn" data-val="1,125,000">
                  Freighter
                </button>
                <button type="button" class="preset-btn" data-val="62,500">
                  DST
                </button>
                <button type="button" class="preset-btn" data-val="12,000">
                  Blockade Runner
                </button>
                <button type="button" class="preset-btn" data-val="5,000">
                  Suniesis
                </button>
              </div>
            </div>

            <div class="checkbox-group">
              <label class="checkbox-item">
                <input type="checkbox" id="type_ipj" class="to_change" />
                <span class="checkbox-custom"></span>
                Low / Nullsec / Dangerous Space
              </label>
            </div>
          </section>

          <section class="result-area">
            <div class="reward-display">
              <div class="reward-label">Estimated Reward</div>
              <div id="reward_output" class="reward-value">0 ISK</div>
              <div id="reward_ipj_output" class="reward-ipj">0 ISK/Jump</div>
              <div
                class="button-group"
                style="display: flex; gap: 1rem; width: 100%; margin-top: 1rem"
              >
                <button
                  type="button"
                  id="copy_btn"
                  class="btn-copy"
                  style="flex: 2"
                >
                  Copy Reward
                </button>
                <button
                  type="button"
                  id="clear_btn"
                  class="btn-copy"
                  style="
                    flex: 1;
                    background: transparent;
                    border-color: rgba(212, 175, 55, 0.3);
                  "
                >
                  Clear
                </button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script>
      const collateralInput = document.getElementById("collateral");
      const jumpsInput = document.getElementById("jumps");
      const volumeInput = document.getElementById("volume");
      const typeIpjCheckbox = document.getElementById("type_ipj");
      const rewardOutput = document.getElementById("reward_output");
      const rewardIpjOutput = document.getElementById("reward_ipj_output");
      const copyBtn = document.getElementById("copy_btn");
      const clearBtn = document.getElementById("clear_btn");

      let currentReward = 0;

      // Optimized formatting logic
      function formatNumber(val) {
        let num = val.toString().replace(/[^0-9]/g, "");
        if (!num) return "";
        return new Intl.NumberFormat("en-US").format(num);
      }

      function parseNum(val) {
        return parseFloat(val.replace(/,/g, "")) || 0;
      }

      function calcReward() {
        const volume = parseNum(volumeInput.value);
        const jumps = Math.max(1, parseNum(jumpsInput.value));
        const collateral = parseNum(collateralInput.value);
        const isLowNull = typeIpjCheckbox.checked;

        if (volume === 0) return 0;

        let base = 1_000_000;
        let add = 0;
        let mult = 1;
        let finalJumps = jumps;

        // Collateral-based scaling
        let adjustedCollat = collateral;
        if (volume > 62500 && collateral < 1e9) {
          adjustedCollat = (3_000_000_000 + collateral) / 4;
        } else if (volume <= 60000 && volume > 12000 && collateral < 1e9) {
          adjustedCollat = (1_000_000_000 + collateral) / 2;
        } else if (volume <= 12000 && collateral < 1e9) {
          adjustedCollat = (100_000_000 + collateral) / 1.1;
        }

        // Short route premium
        if (finalJumps < 5) {
          finalJumps = (5 + finalJumps) * 0.5;
        }

        // High collateral scaling logic
        if (collateral > 3_000_000_000 && volume > 60_000) {
          mult *= Math.max(
            1.0,
            Math.log(collateral / 150_000_000) / Math.log(15),
          );
        }

        // Surcharges for massive volume/collateral risk
        if (volume > 1_050_000) {
          add += 250_000;
          if (collateral > 2e9) add += 200_000;
        } else if (volume > 880_000) {
          if (collateral > 1.5e9) add += 100_000;
          if (collateral > 2.5e9) add += 100_000;
          if (collateral > 3e9) add += 200_000;
        } else if (volume > 750_000) {
          if (collateral > 2.5e9) add += 100_000;
          if (collateral > 3e9) add += 200_000;
        } else if (volume > 500_000) {
          if (collateral > 2e9) add += 100_000;
          if (collateral > 3.5e9) add += 100_000;
        }

        if (isLowNull) {
          mult *= 2;
        }

        if (!isLowNull || volume <= 62_500) {
          return (
            ((mult * base * adjustedCollat) / 1_000_000_000 + add) * finalJumps
          );
        } else if (isLowNull && volume > 386_000) {
          return "Shipment too large for dangerous routes";
        } else {
          // Jump Freighter logic for Deep Space
          base = 60_000_000;
          if (volume < 100) mult = 0.25;
          else if (volume <= 12_000) mult = 0.5;
          else if (volume <= 60_000) mult = 0.75;
          else if (volume <= 340_000) mult = 1;
          else mult = 4;

          return mult * base * Math.max(1.0, jumps / 7) + collateral * 0.01;
        }
      }

      function updateAll() {
        const reward = calcReward();
        currentReward = reward;
        const rawJumps = parseNum(jumpsInput.value) || 1;

        if (typeof reward === "string") {
          rewardOutput.textContent = reward;
          rewardOutput.style.fontSize = "1.2rem";
          rewardIpjOutput.textContent = "N/A";
        } else if (reward > 0) {
          const finalVal = Math.max(1_000_000, reward);
          rewardOutput.textContent = formatNumber(Math.ceil(finalVal)) + " ISK";
          rewardOutput.style.fontSize = "3rem";

          const ipj = finalVal / rawJumps;
          rewardIpjOutput.textContent =
            formatNumber(Math.ceil(ipj)) + " ISK/Jump";
        } else {
          rewardOutput.textContent = "0 ISK";
          rewardOutput.style.fontSize = "3rem";
          rewardIpjOutput.textContent = "0 ISK/Jump";
        }
      }

      // Live formatting as user types
      document.querySelectorAll(".to_format_number").forEach((input) => {
        input.addEventListener("input", (e) => {
          const cursorPosition = e.target.selectionStart;
          const oldLength = e.target.value.length;
          e.target.value = formatNumber(e.target.value);
          const newLength = e.target.value.length;
          e.target.setSelectionRange(
            cursorPosition + (newLength - oldLength),
            cursorPosition + (newLength - oldLength),
          );
          updateAll();
        });
      });

      document.querySelectorAll(".to_change").forEach((el) => {
        el.addEventListener("change", updateAll);
      });

      document.querySelectorAll(".preset-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          volumeInput.value = btn.getAttribute("data-val");
          volumeInput.value = formatNumber(volumeInput.value); // Ensure it's formatted
          updateAll();

          // Visual feedback
          btn.style.transform = "scale(0.95)";
          setTimeout(() => (btn.style.transform = ""), 100);
        });
      });

      copyBtn.addEventListener("click", async () => {
        if (typeof currentReward === "number" && currentReward > 0) {
          const val = Math.ceil(Math.max(1_000_000, currentReward)).toString();
          try {
            await navigator.clipboard.writeText(val);
            const originalText = copyBtn.textContent;
            copyBtn.textContent = "Reward Copied!";
            copyBtn.classList.add("copied");
            setTimeout(() => {
              copyBtn.textContent = originalText;
              copyBtn.classList.remove("copied");
            }, 2000);
          } catch (err) {
            console.error("Failed to copy: ", err);
          }
        }
      });

      clearBtn.addEventListener("click", () => {
        collateralInput.value = "";
        jumpsInput.value = "";
        volumeInput.value = "";
        typeIpjCheckbox.checked = false;
        updateAll();
      });

      // Initialize display
      updateAll();
    </script>
  </body>
</html>
